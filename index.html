<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💩 Poo Tracker 2026 — Triatlon Tetuan</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface2: #1e1e1e;
      --border: #2a2a2a;
      --text: #efefef;
      --muted: #777;
      --orange: #ff6b35;
      --card-radius: 10px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }
    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #140800 0%, #1f0e00 100%);
      border-bottom: 1px solid #ff6b3525;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .header-brand { display: flex; flex-direction: column; gap: 2px; }
    .header-title { font-size: 18px; font-weight: 700; color: var(--orange); letter-spacing: -0.3px; }
    .header-sub { font-size: 11px; color: var(--muted); }
    .main-tabs { display: flex; gap: 4px; }
    .main-tab {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all .15s;
    }
    .main-tab.active { background: var(--orange); border-color: var(--orange); color: #fff; }
    .main-tab:hover:not(.active) { border-color: var(--orange); color: var(--orange); }
    /* ── Layout ── */
    .content { padding: 20px 24px 40px; max-width: 1440px; margin: 0 auto; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    /* ── KPI Grid ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 14px 16px;
      cursor: default;
      transition: transform .15s, border-color .15s;
    }
    .kpi-card:hover { transform: translateY(-2px); border-color: var(--orange); }
    .kpi-icon { font-size: 20px; margin-bottom: 6px; }
    .kpi-value { font-size: 22px; font-weight: 700; color: var(--orange); line-height: 1.1; }
    .kpi-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-top: 3px; }
    .kpi-sub { font-size: 11px; color: #555; margin-top: 2px; }
    /* ── Chart cards ── */
    .row { display: grid; gap: 12px; margin-bottom: 12px; }
    .row.c2 { grid-template-columns: 1fr 1fr; }
    .row.c3 { grid-template-columns: 320px 1fr; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 18px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 14px;
    }
    .ch { position: relative; }
    /* ── Leaderboard ── */
    .lb-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .lb-table th {
      color: var(--muted); font-weight: 500; font-size: 10px;
      text-transform: uppercase; letter-spacing: .5px;
      padding: 6px 6px; border-bottom: 1px solid var(--border); text-align: left;
    }
    .lb-table td { padding: 9px 6px; border-bottom: 1px solid #1c1c1c; vertical-align: middle; }
    .lb-table tr:last-child td { border-bottom: none; }
    .rank-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%; font-weight: 700; font-size: 10px;
    }
    .r1 { background: #FFD700; color: #000; }
    .r2 { background: #C0C0C0; color: #000; }
    .r3 { background: #CD7F32; color: #000; }
    .rn { background: #222; color: var(--muted); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    .bar-wrap { background: #222; border-radius: 2px; height: 3px; margin-top: 4px; }
    .bar-fill { height: 3px; border-radius: 2px; }
    /* ── Heatmap ── */
    .hm-scroll { overflow-x: auto; padding-bottom: 4px; }
    /* ── Profile tab ── */
    .ptabs-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .ptab {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); padding: 7px 15px; border-radius: 20px;
      cursor: pointer; font-size: 12px; font-weight: 500; transition: all .15s;
    }
    .ptab:hover { opacity: .8; }
    .profile-banner {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--card-radius); padding: 18px 20px;
      margin-bottom: 12px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .p-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; flex-shrink: 0;
    }
    .p-name { font-size: 20px; font-weight: 700; }
    .p-rank { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .p-stats { display: flex; gap: 20px; margin-left: auto; flex-wrap: wrap; }
    .p-stat { text-align: center; }
    .p-stat-val { font-size: 20px; font-weight: 700; }
    .p-stat-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    /* ── Medals ── */
    .medals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .medal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform .15s, border-color .15s;
    }
    .medal-card:hover { transform: translateY(-2px); }
    .medal-icon {
      font-size: 30px;
      flex-shrink: 0;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: #1e1e1e;
    }
    .medal-body { min-width: 0; }
    .medal-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    .medal-winner { font-size: 16px; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .medal-stat { font-size: 11px; color: var(--muted); margin-top: 1px; }
    /* ── Tooltip ── */
    #tooltip {
      position: fixed; background: #1e1e1e; border: 1px solid #3a3a3a;
      border-radius: 6px; padding: 6px 10px; font-size: 12px;
      pointer-events: none; z-index: 999; display: none; white-space: nowrap;
    }
    /* ── Responsive ── */
    @media (max-width: 860px) {
      .row.c2, .row.c3 { grid-template-columns: 1fr; }
      .p-stats { display: none; }
    }
  </style>
</head>
<body>

<div id="tooltip"></div>

<header class="header">
  <div class="header-brand">
    <div class="header-title">💩 Poo Tracker 2026</div>
    <div class="header-sub">Triatlon Tetuan · Feb 16 – Apr 27, 2026</div>
  </div>
  <div class="main-tabs">
    <button class="main-tab active" onclick="switchTab('group',this)">Group</button>
    <button class="main-tab" onclick="switchTab('profiles',this)">Profiles</button>
  </div>
</header>

<main class="content">

  <!-- ── GROUP TAB ── -->
  <div id="tab-group" class="tab-panel active">
    <div class="kpi-grid" id="kpi-grid"></div>
    <div class="medals-grid" id="medals-grid"></div>
    <div class="row c3">
      <div class="card">
        <div class="card-title">🏆 Leaderboard</div>
        <div id="lb"></div>
      </div>
      <div class="card">
        <div class="card-title">📈 Cumulative Poos Over Time</div>
        <div class="ch" style="height:290px"><canvas id="c-cumul"></canvas></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">📅 Activity Calendar — Group</div>
      <div class="hm-scroll"><div id="hm-group"></div></div>
    </div>
    <div class="row c2">
      <div class="card">
        <div class="card-title">⏰ Happy Hour</div>
        <div class="ch" style="height:190px"><canvas id="c-hh"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">📆 Day of Week</div>
        <div class="ch" style="height:190px"><canvas id="c-dow"></canvas></div>
      </div>
    </div>
    <div class="row c2" style="margin-top:12px">
      <div class="card">
        <div class="card-title">🔥 Streaks (Longest / Current)</div>
        <div class="ch" style="height:210px"><canvas id="c-streaks"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">📊 Daily Poos — Group Total</div>
        <div class="ch" style="height:210px"><canvas id="c-daily"></canvas></div>
      </div>
    </div>
  </div>

  <!-- ── PROFILES TAB ── -->
  <div id="tab-profiles" class="tab-panel">
    <div class="ptabs-row" id="ptabs-row"></div>
    <div id="profile-content"></div>
  </div>

</main>

// ─── PALETTE & NAMES ────────────────────────────────────────────────────────
const PALETTE = [
  '#ff6b35','#4ecdc4','#ffe66d','#a8e6cf',
  '#ff8b94','#b8b8ff','#ffd93d','#6bcb77',
  '#4d96ff','#c77dff','#ff9f1c','#e76f51'
];
const HEADSTARTS = {
  'Raúl': 128, 'Maldo': 45, 'Jesús': 44,
  'Sendra': 31, 'Pablo': 24, 'Sergio': 25
};
const nameCounts = {};
events.forEach(e => nameCounts[e.name] = (nameCounts[e.name]||0)+1);
Object.keys(HEADSTARTS).forEach(n => { if(nameCounts[n]) nameCounts[n] += HEADSTARTS[n]; });
const NAMES = Object.keys(nameCounts).sort((a,b)=>nameCounts[b]-nameCounts[a]);
const COLORS = {};
NAMES.forEach((n,i) => COLORS[n] = PALETTE[i % PALETTE.length]);

// Date range
const minTs = Math.min(...events.map(e=>e.date));
const maxTs = Math.max(...events.map(e=>e.date));
const minDate = new Date(minTs); minDate.setHours(0,0,0,0);
const maxDate = new Date(maxTs); maxDate.setHours(23,59,59,999);

// All dates in chat range (for charts)
const ALL_DATES = [];
{ let d = new Date(minDate);
  while (d <= maxDate) { ALL_DATES.push(d.toISOString().substring(0,10)); d.setDate(d.getDate()+1); }
}
// Full season: Jan 1 2026 → last event (headstarts begin Jan 1)
const SEASON_START = new Date('2026-01-01');
const SEASON_DAYS = Math.floor((maxDate - SEASON_START) / 86400000) + 1;

// ─── ANALYTICS ──────────────────────────────────────────────────────────────
function eventsFor(name) { return name ? events.filter(e=>e.name===name) : events; }

function dailyCounts(name=null) {
  const c={};
  eventsFor(name).forEach(e=>{ c[e.ds]=(c[e.ds]||0)+1; });
  return c;
}

function hourlyDist(name=null) {
  const h=new Array(24).fill(0);
  eventsFor(name).forEach(e=>h[e.date.getHours()]++);
  return h;
}

function dowDist(name=null) {
  const d=new Array(7).fill(0);
  eventsFor(name).forEach(e=>d[e.date.getDay()]++);
  return d;
}

function streaks(name) {
  const days=[...new Set(eventsFor(name).map(e=>e.ds))].sort();
  if (!days.length) return {longest:0,current:0};
  let longest=1, cur=1, curStart=days[0];
  for (let i=1;i<days.length;i++){
    const diff=(new Date(days[i])-new Date(days[i-1]))/86400000;
    if(diff===1){ cur++; if(cur>longest) longest=cur; }
    else { cur=1; curStart=days[i]; }
  }
  const last=new Date(days[days.length-1]);
  const today=new Date(); today.setHours(0,0,0,0);
  const gap=Math.floor((today-last)/86400000);
  return {longest, current: gap<=1 ? cur : 0};
}

function cumulSeries(name) {
  const dc=dailyCounts(name);
  let c=HEADSTARTS[name]||0;
  return ALL_DATES.map(ds=>{ c+=(dc[ds]||0); return c; });
}

// ─── KPI CARDS ──────────────────────────────────────────────────────────────
function renderKPIs() {
  const total = events.length;
  const leader = NAMES[0];
  const lc = nameCounts[leader];

  const hh = hourlyDist();
  const peakH = hh.indexOf(Math.max(...hh));
  const peakHStr = `${peakH}:00`;

  const allSt = NAMES.map(n=>({n,...streaks(n)}));
  const topSt = allSt.reduce((a,b)=>a.longest>b.longest?a:b);

  const dc = dailyCounts();
  const dvals = Object.values(dc);
  const maxDayVal = Math.max(...dvals);
  const bestDateStr = Object.keys(dc).find(d=>dc[d]===maxDayVal)||'';

  const avgDay = (total/SEASON_DAYS).toFixed(1);

  let bestPerson = {name:'',count:0};
  NAMES.forEach(n=>{
    const m=Math.max(...Object.values(dailyCounts(n)));
    if(m>bestPerson.count) bestPerson={name:n,count:m};
  });

  const activeDays = Object.keys(dc).length;
  const totalPooers = NAMES.length;
  const totalDays = SEASON_DAYS;

  const kpis=[
    {icon:'💩',val:total.toLocaleString(),lbl:'Total Poos',sub:`${totalPooers} athletes`},
    {icon:'🥇',val:leader,lbl:'Leader',sub:`${lc} poos`},
    {icon:'⏰',val:peakHStr,lbl:'Happy Hour',sub:`${hh[peakH]} poos`},
    {icon:'🔥',val:`${topSt.longest}d`,lbl:'Top Streak',sub:topSt.n},
    {icon:'📈',val:avgDay,lbl:'Avg / Day',sub:'group total'},
    {icon:'📅',val:bestDateStr.substring(5)||'—',lbl:'Best Day',sub:`${maxDayVal} poos`},
    {icon:'✅',val:activeDays,lbl:'Active Days',sub:`of ${totalDays}`},
    {icon:'⚡',val:`${bestPerson.count}`,lbl:'Max in 1 Day',sub:bestPerson.name},
  ];

  document.getElementById('kpi-grid').innerHTML = kpis.map(k=>`
    <div class="kpi-card">
      <div class="kpi-icon">${k.icon}</div>

// ─── HEATMAP ─────────────────────────────────────────────────────────────────
function renderHeatmap(containerId, name=null) {
  const dc = dailyCounts(name);
  const maxVal = Math.max(...Object.values(dc),1);
  const tooltip = document.getElementById('tooltip');

  // start from Monday of the first week
  const s = new Date(minDate);
  const dow0 = (s.getDay()+6)%7; // Mon=0
  s.setDate(s.getDate()-dow0);

  const weeks=[], CELL=13, GAP=2, PL=26, PT=22;
  let week=[], d=new Date(s);
  while (d<=maxDate) {
    if(week.length===7){weeks.push(week);week=[];}
    const ds=d.toISOString().substring(0,10);
    week.push({ds, cnt:dc[ds]||0, active:d>=minDate&&d<=maxDate});
    d.setDate(d.getDate()+1);
  }
  while(week.length<7) week.push({ds:'',cnt:0,active:false});
  weeks.push(week);

  const W=PL+weeks.length*(CELL+GAP)+60, H=PT+7*(CELL+GAP)+24;

  function col(cnt,active){
    if(!active||cnt===0) return '#1a1a1a';
    const t=Math.min(cnt/maxVal,1);
    return `rgb(${Math.round(20+t*10)},${Math.round(60+t*140)},${Math.round(20+t*10)})`;
  }

  let svg=`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="display:block">`;
  ['M','T','W','T','F','S','S'].forEach((l,i)=>{
    if(i%2===0) svg+=`<text x="${PL-4}" y="${PT+i*(CELL+GAP)+CELL-1}" text-anchor="end" font-size="9" fill="#555">${l}</text>`;
  });

  let lastMon='';
  weeks.forEach((wk,wi)=>{
    const x=PL+wi*(CELL+GAP);
    const first=wk.find(c=>c.active&&c.ds);
    if(first){
      const mo=new Date(first.ds).toLocaleString('en-US',{month:'short'});
      if(mo!==lastMon){ svg+=`<text x="${x}" y="${PT-6}" font-size="9" fill="#555">${mo}</text>`; lastMon=mo; }
    }
    wk.forEach((cell,di)=>{
      const y=PT+di*(CELL+GAP);
      svg+=`<rect x="${x}" y="${y}" width="${CELL}" height="${CELL}" rx="2" fill="${col(cell.cnt,cell.active)}" data-ds="${cell.ds}" data-cnt="${cell.cnt}" data-a="${cell.active}" style="cursor:${cell.active?'pointer':'default'}"/>`;
    });
  });

  // legend
  const lx=W-60, ly=H-13;
  svg+=`<text x="${lx-2}" y="${ly+CELL-1}" font-size="9" fill="#555" text-anchor="end">Less</text>`;
  [0,.25,.5,.75,1].forEach((v,i)=>
    svg+=`<rect x="${lx+i*(CELL+1)}" y="${ly}" width="${CELL}" height="${CELL}" rx="2" fill="${col(v*maxVal,true)}"/>`
  );
  svg+=`<text x="${lx+5*(CELL+1)+2}" y="${ly+CELL-1}" font-size="9" fill="#555">More</text>`;
  svg+=`</svg>`;

  const el=document.getElementById(containerId);
  el.innerHTML=svg;

  el.querySelectorAll('rect[data-a="true"]').forEach(r=>{
    r.addEventListener('mouseenter',()=>{
      tooltip.style.display='block';
      tooltip.innerHTML=`<strong>${r.dataset.ds}</strong><br>${r.dataset.cnt} poo${r.dataset.cnt!='1'?'s':''}`;
    });
    r.addEventListener('mousemove',e=>{
      tooltip.style.left=(e.clientX+14)+'px';
      tooltip.style.top=(e.clientY-30)+'px';
    });
    r.addEventListener('mouseleave',()=>tooltip.style.display='none');
  });
}

// ─── MEDALS ──────────────────────────────────────────────────────────────────
function maxInWindow(name, ms) {
  const ts = eventsFor(name).map(e => e.date.getTime()).sort((a,b)=>a-b);
  let max = 0;
  for (let i = 0; i < ts.length; i++) {
    let cnt = 1;
    for (let j = i+1; j < ts.length && ts[j]-ts[i] <= ms; j++) cnt++;
    if (cnt > max) max = cnt;
  }
  return max;
}

function bestInWindow(hours) {
  let best = {name:'', count:0};
  NAMES.forEach(n => {
    const c = maxInWindow(n, hours*3600000);
    if (c > best.count) best = {name:n, count:c};
  });
  return best;
}

// Day boundary at 6am: anything before 6am belongs to previous day
function pooDayKey(date) {
  const d = new Date(date);
  if (d.getHours() < 6) d.setDate(d.getDate()-1);
  return d.toISOString().substring(0,10);
}

function earlyLateStats() {
  const byDay = {};
  events.forEach(e => {
    const key = pooDayKey(e.date);
    if (!byDay[key]) byDay[key] = [];
    byDay[key].push(e);
  });
  const firstCounts = {}, lastCounts = {};
  Object.values(byDay).forEach(dayEvts => {
    dayEvts.sort((a,b) => a.date-b.date);
    const first = dayEvts[0].name;
    const last  = dayEvts[dayEvts.length-1].name;
    firstCounts[first] = (firstCounts[first]||0)+1;
    lastCounts[last]   = (lastCounts[last]||0)+1;
  });
  const earlyBird = NAMES.reduce((b,n)=>(firstCounts[n]||0)>(firstCounts[b]||0)?n:b, NAMES[0]);
  const nightOwl  = NAMES.reduce((b,n)=>(lastCounts[n]||0)>(lastCounts[b]||0)?n:b, NAMES[0]);
  return {
    earlyBird: {name:earlyBird, count:firstCounts[earlyBird]||0},
    nightOwl:  {name:nightOwl,  count:lastCounts[nightOwl]||0},
  };
}

function fmtHour(h) {
  const hh = Math.floor(h), mm = Math.round((h-hh)*60);
  const ampm = hh < 12 ? 'am' : 'pm';
  return `${hh%12||12}:${String(mm).padStart(2,'0')}${ampm}`;
}

function dailyStdDev(name) {
  // Std dev of poos-per-day, only days with data
  const vals = Object.values(dailyCounts(name));
  if (vals.length < 2) return 0;
  const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
  return Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length);
}

function renderMedals() {
  const w1 = bestInWindow(1), w2 = bestInWindow(2), w3 = bestInWindow(3);

  const {earlyBird, nightOwl} = earlyLateStats();
  const variable = NAMES.reduce((b,n)=>{ const v=dailyStdDev(n); return v>b.v?{name:n,v}:b; },{name:'',v:-Infinity});

  const medals = [
    { icon:'⚡', title:'Corta-Heces', name:w1.name, stat:`${w1.count} poos in 1 hour`, color:'#ff6b35' },
    { icon:'🚀', title:'2h Blitz',    name:w2.name, stat:`${w2.count} poos in 2 hours`, color:'#4ecdc4' },
    { icon:'💪', title:'3h Beast',    name:w3.name, stat:`${w3.count} poos in 3 hours`, color:'#ffe66d' },
    { icon:'🌅', title:'Early Bird',  name:earlyBird.name, stat:`First of the day ${earlyBird.count}×`, color:'#a8e6cf' },
    { icon:'🌙', title:'Night Owl',   name:nightOwl.name,  stat:`Last of the day ${nightOwl.count}×`, color:'#b8b8ff' },
    { icon:'🎲', title:'Wild Card',   name:variable.name,  stat:`±${variable.v.toFixed(1)} poos/day`, color:'#ff8b94' },
  ];

  document.getElementById('medals-grid').innerHTML = medals.map(m => `
    <div class="medal-card" style="border-color:${COLORS[m.name]||'#333'}40">
      <div class="medal-icon" style="background:${COLORS[m.name]||'#333'}20">${m.icon}</div>
      <div class="medal-body">
        <div class="medal-title">${m.title}</div>
        <div class="medal-winner" style="color:${COLORS[m.name]||'#fff'}">${m.name}</div>
        <div class="medal-stat">${m.stat}</div>
      </div>
    </div>`).join('');
}
