<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💩 Poo Tracker 2026 — Triatlon Tetuan</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface2: #1e1e1e;
      --border: #2a2a2a;
      --text: #efefef;
      --muted: #777;
      --orange: #ff6b35;
      --card-radius: 10px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }
    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #140800 0%, #1f0e00 100%);
      border-bottom: 1px solid #ff6b3525;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .header-brand { display: flex; flex-direction: column; gap: 2px; }
    .header-title { font-size: 18px; font-weight: 700; color: var(--orange); letter-spacing: -0.3px; }
    .header-sub { font-size: 11px; color: var(--muted); }
    .main-tabs { display: flex; gap: 4px; }
    .main-tab {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all .15s;
    }
    .main-tab.active { background: var(--orange); border-color: var(--orange); color: #fff; }
    .main-tab:hover:not(.active) { border-color: var(--orange); color: var(--orange); }
    /* ── Layout ── */
    .content { padding: 20px 24px 40px; max-width: 1440px; margin: 0 auto; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    /* ── KPI Grid ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 14px 16px;
      cursor: default;
      transition: transform .15s, border-color .15s;
    }
    .kpi-card:hover { transform: translateY(-2px); border-color: var(--orange); }
    .kpi-icon { font-size: 20px; margin-bottom: 6px; }
    .kpi-value { font-size: 22px; font-weight: 700; color: var(--orange); line-height: 1.1; }
    .kpi-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-top: 3px; }
    .kpi-sub { font-size: 11px; color: #555; margin-top: 2px; }
    /* ── Chart cards ── */
    .row { display: grid; gap: 12px; margin-bottom: 12px; }
    .row.c2 { grid-template-columns: 1fr 1fr; }
    .row.c3 { grid-template-columns: 320px 1fr; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 18px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 14px;
    }
    .ch { position: relative; }
    /* ── Leaderboard ── */
    .lb-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .lb-table th {
      color: var(--muted); font-weight: 500; font-size: 10px;
      text-transform: uppercase; letter-spacing: .5px;
      padding: 6px 6px; border-bottom: 1px solid var(--border); text-align: left;
    }
    .lb-table td { padding: 9px 6px; border-bottom: 1px solid #1c1c1c; vertical-align: middle; }
    .lb-table tr:last-child td { border-bottom: none; }
    .rank-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%; font-weight: 700; font-size: 10px;
    }
    .r1 { background: #FFD700; color: #000; }
    .r2 { background: #C0C0C0; color: #000; }
    .r3 { background: #CD7F32; color: #000; }
    .rn { background: #222; color: var(--muted); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    .bar-wrap { background: #222; border-radius: 2px; height: 3px; margin-top: 4px; }
    .bar-fill { height: 3px; border-radius: 2px; }
    /* ── Heatmap ── */
    .hm-scroll { overflow-x: auto; padding-bottom: 4px; }
    /* ── Profile tab ── */
    .ptabs-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .ptab {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); padding: 7px 15px; border-radius: 20px;
      cursor: pointer; font-size: 12px; font-weight: 500; transition: all .15s;
    }
    .ptab:hover { opacity: .8; }
    .profile-banner {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--card-radius); padding: 18px 20px;
      margin-bottom: 12px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .p-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; flex-shrink: 0;
    }
    .p-name { font-size: 20px; font-weight: 700; }
    .p-rank { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .p-stats { display: flex; gap: 20px; margin-left: auto; flex-wrap: wrap; }
    .p-stat { text-align: center; }
    .p-stat-val { font-size: 20px; font-weight: 700; }
    .p-stat-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    /* ── Medals ── */
    .medals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .medal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform .15s, border-color .15s;
    }
    .medal-card:hover { transform: translateY(-2px); }
    .medal-card { position: relative; }
    .medal-info {
      position: absolute; top: 8px; right: 8px;
      width: 16px; height: 16px; border-radius: 50%;
      background: #2a2a2a; color: #666;
      font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      cursor: help; flex-shrink: 0;
      transition: background .15s, color .15s;
    }
    .medal-info:hover { background: #444; color: #ccc; }
    .medal-info-tip {
      display: none;
      position: absolute; top: 26px; right: 0;
      width: 200px;
      background: #1e1e1e; border: 1px solid #3a3a3a;
      border-radius: 7px; padding: 8px 10px;
      font-size: 11px; color: #aaa; line-height: 1.5;
      z-index: 500; pointer-events: none;
    }
    .medal-info:hover .medal-info-tip { display: block; }
    .medal-icon {
      font-size: 30px;
      flex-shrink: 0;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: #1e1e1e;
    }
    .medal-body { min-width: 0; }
    .medal-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    .medal-winner { font-size: 16px; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .medal-stat { font-size: 11px; color: var(--muted); margin-top: 1px; }
    /* ── Tooltip ── */
    #tooltip {
      position: fixed; background: #1e1e1e; border: 1px solid #3a3a3a;
      border-radius: 6px; padding: 6px 10px; font-size: 12px;
      pointer-events: none; z-index: 999; display: none; white-space: nowrap;
    }
    /* ── Responsive ── */
    @media (max-width: 860px) {
      .row.c2, .row.c3 { grid-template-columns: 1fr; }
      .p-stats { display: none; }
    }
  </style>
</head>
<body>

<div id="tooltip"></div>

<header class="header">
  <div class="header-brand">
    <div class="header-title">💩 Poo Tracker 2026</div>
    <div class="header-sub">Triatlon Tetuan · Feb 16 – Apr 27, 2026</div>
  </div>
  <div class="main-tabs">
    <button class="main-tab active" onclick="switchTab('group',this)">Group</button>
    <button class="main-tab" onclick="switchTab('profiles',this)">Profiles</button>
  </div>
</header>

<main class="content">

  <!-- ── GROUP TAB ── -->
  <div id="tab-group" class="tab-panel active">
    <div class="kpi-grid" id="kpi-grid"></div>
    <div class="medals-grid" id="medals-grid"></div>
    <div class="row c3">
      <div class="card">
        <div class="card-title">🏆 Leaderboard</div>
        <div id="lb"></div>
      </div>
      <div class="card">
        <div class="card-title">📈 Cumulative Poos Over Time</div>
        <div class="ch" style="height:290px"><canvas id="c-cumul"></canvas></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">📅 Activity Calendar — Group</div>
      <div class="hm-scroll"><div id="hm-group"></div></div>
    </div>
    <div class="row c2">
      <div class="card">
        <div class="card-title">⏰ Happy Hour</div>
        <div class="ch" style="height:190px"><canvas id="c-hh"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">📆 Day of Week</div>
        <div class="ch" style="height:190px"><canvas id="c-dow"></canvas></div>
      </div>
    </div>
    <div class="row c2" style="margin-top:12px">
      <div class="card">
        <div class="card-title">🔥 Streaks (Longest / Current)</div>
        <div class="ch" style="height:210px"><canvas id="c-streaks"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">📊 Daily Poos — Group Total</div>
        <div class="ch" style="height:210px"><canvas id="c-daily"></canvas></div>
      </div>
    </div>
  </div>

  <!-- ── PROFILES TAB ── -->
  <div id="tab-profiles" class="tab-panel">
    <div class="ptabs-row" id="ptabs-row"></div>
    <div id="profile-content"></div>
  </div>

</main>

<script>
// ─── DATA (loaded via fetch) ───────────────────────────────────────────────
let POO_DATA = [];

const events = [];

// ─── PALETTE & NAMES ────────────────────────────────────────────────────────
const PALETTE = [
  '#ff6b35','#4ecdc4','#ffe66d','#a8e6cf',
  '#ff8b94','#b8b8ff','#ffd93d','#6bcb77',
  '#4d96ff','#c77dff','#ff9f1c','#e76f51'
];
const HEADSTARTS = {
  'Raúl': 45, 'Maldo': 45, 'Jesús': 44,
  'Sendra': 31, 'Pablo': 24, 'Sergio': 25
};
const nameCounts = {};
const NAMES = [];
const COLORS = {};

// Date range — populated after fetch
let minDate = new Date();
let maxDate = new Date();
let ALL_DATES = [];
let SEASON_DAYS = 1;

function recomputeDateRange() {
  const ts = events.map(e => e.date);
  minDate = new Date('2026-01-16'); minDate.setHours(0,0,0,0);
  maxDate = new Date(Math.max(...ts)); maxDate.setHours(23,59,59,999);
  ALL_DATES = [];
  let d = new Date(minDate);
  while (d <= maxDate) { ALL_DATES.push(d.toISOString().substring(0,10)); d.setDate(d.getDate()+1); }
  SEASON_DAYS = Math.floor((maxDate - new Date('2026-01-01')) / 86400000) + 1;
}

// ─── ANALYTICS ──────────────────────────────────────────────────────────────
function eventsFor(name) { return name ? events.filter(e=>e.name===name) : events; }

function dailyCounts(name=null) {
  const c={};
  eventsFor(name).forEach(e=>{ c[e.ds]=(c[e.ds]||0)+1; });
  return c;
}

function hourlyDist(name=null) {
  const h=new Array(24).fill(0);
  eventsFor(name).forEach(e=>h[e.date.getHours()]++);
  return h;
}

function dowDist(name=null) {
  const d=new Array(7).fill(0);
  eventsFor(name).forEach(e=>d[e.date.getDay()]++);
  return d;
}

function streaks(name) {
  const days=[...new Set(eventsFor(name).map(e=>e.ds))].sort();
  if (!days.length) return {longest:0,current:0};
  let longest=1, cur=1, curStart=days[0];
  for (let i=1;i<days.length;i++){
    const diff=(new Date(days[i])-new Date(days[i-1]))/86400000;
    if(diff===1){ cur++; if(cur>longest) longest=cur; }
    else { cur=1; curStart=days[i]; }
  }
  const last=new Date(days[days.length-1]);
  const today=new Date(); today.setHours(0,0,0,0);
  const gap=Math.floor((today-last)/86400000);
  return {longest, current: gap<=1 ? cur : 0};
}

function cumulSeries(name) {
  const dc=dailyCounts(name);
  let c=HEADSTARTS[name]||0;
  return ALL_DATES.map(ds=>{ c+=(dc[ds]||0); return c; });
}

// ─── CHART.JS DEFAULTS ──────────────────────────────────────────────────────
Chart.defaults.color='#666';
Chart.defaults.borderColor='#2a2a2a';
Chart.defaults.font.family='-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif';
Chart.defaults.font.size=11;

const DARK_TOOLTIP = { backgroundColor:'#1e1e1e', borderColor:'#3a3a3a', borderWidth:1, titleColor:'#ccc', bodyColor:'#ccc' };

// destroy helper
const _charts = {};
function mkChart(id, config) {
  if (_charts[id]) { _charts[id].destroy(); }
  _charts[id] = new Chart(document.getElementById(id), config);
  return _charts[id];
}

// ─── KPI CARDS ──────────────────────────────────────────────────────────────
function renderKPIs() {
  const total = events.length;
  const leader = NAMES[0];
  const lc = nameCounts[leader];

  const hh = hourlyDist();
  const peakH = hh.indexOf(Math.max(...hh));
  const peakHStr = `${peakH}:00`;

  const allSt = NAMES.map(n=>({n,...streaks(n)}));
  const topSt = allSt.reduce((a,b)=>a.longest>b.longest?a:b);

  const dc = dailyCounts();
  const dvals = Object.values(dc);
  const maxDayVal = Math.max(...dvals);
  const bestDateStr = Object.keys(dc).find(d=>dc[d]===maxDayVal)||'';

  const avgDay = (total/SEASON_DAYS).toFixed(1);

  let bestPerson = {name:'',count:0};
  NAMES.forEach(n=>{
    const m=Math.max(...Object.values(dailyCounts(n)));
    if(m>bestPerson.count) bestPerson={name:n,count:m};
  });

  const activeDays = Object.keys(dc).length;
  const totalPooers = NAMES.length;
  const totalDays = SEASON_DAYS;

  const kpis=[
    {icon:'💩',val:total.toLocaleString(),lbl:'Total Poos',sub:`${totalPooers} athletes`},
    {icon:'🥇',val:leader,lbl:'Leader',sub:`${lc} poos`},
    {icon:'⏰',val:peakHStr,lbl:'Happy Hour',sub:`${hh[peakH]} poos`},
    {icon:'🔥',val:`${topSt.longest}d`,lbl:'Top Streak',sub:topSt.n},
    {icon:'📈',val:avgDay,lbl:'Avg / Day',sub:'group total'},
    {icon:'📅',val:bestDateStr.substring(5)||'—',lbl:'Best Day',sub:`${maxDayVal} poos`},
    {icon:'✅',val:activeDays,lbl:'Active Days',sub:`of ${totalDays}`},
    {icon:'⚡',val:`${bestPerson.count}`,lbl:'Max in 1 Day',sub:bestPerson.name},
  ];

  document.getElementById('kpi-grid').innerHTML = kpis.map(k=>`
    <div class="kpi-card">
      <div class="kpi-icon">${k.icon}</div>
      <div class="kpi-value">${k.val}</div>
      <div class="kpi-label">${k.lbl}</div>
      <div class="kpi-sub">${k.sub}</div>
    </div>`).join('');
}

// ─── LEADERBOARD ────────────────────────────────────────────────────────────
function renderLeaderboard() {
  const max = nameCounts[NAMES[0]];
  const rankClass = ['r1','r2','r3'];
  document.getElementById('lb').innerHTML = `
    <table class="lb-table">
      <thead><tr><th>#</th><th>Athlete</th><th>Total</th><th>Avg/d</th><th>Best</th></tr></thead>
      <tbody>${NAMES.map((n,i)=>{
        const cnt=nameCounts[n], pct=((cnt/max)*100).toFixed(0);
        const dc=dailyCounts(n);
        const best=Math.max(...Object.values(dc));
        const rc=rankClass[i]||'rn', c=COLORS[n];
        return `<tr>
          <td><span class="rank-badge ${rc}">${i+1}</span></td>
          <td>
            <span class="dot" style="background:${c}"></span><strong>${n}</strong>
            <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${c}"></div></div>
          </td>
          <td style="font-weight:700;color:${c}">${cnt}</td>
          <td style="color:var(--muted)">${(cnt/SEASON_DAYS).toFixed(2)}</td>
          <td style="color:var(--muted)">${best}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
}

// ─── CUMULATIVE CHART ────────────────────────────────────────────────────────
function renderCumulative(canvasId, focusName=null) {
  const tickLabels = ALL_DATES.filter((_,i)=>i%7===0||i===ALL_DATES.length-1)
    .map(d=>d.substring(5));
  const tickIdxs = ALL_DATES.reduce((acc,d,i)=>{ if(i%7===0||i===ALL_DATES.length-1) acc.push(i); return acc; },[]);

  const names = focusName ? [focusName] : NAMES;
  const datasets = names.map(n=>({
    label: n,
    data: cumulSeries(n),
    borderColor: COLORS[n],
    backgroundColor: focusName ? COLORS[n]+'25' : 'transparent',
    fill: !!focusName,
    borderWidth: focusName ? 2.5 : 1.8,
    pointRadius: 0,
    tension: 0.3,
  }));

  if (focusName) {
    // add group avg
    const avgSeries = ALL_DATES.map((_,di)=>{
      const sum = NAMES.reduce((s,n)=>s+cumulSeries(n)[di],0);
      return +(sum/NAMES.length).toFixed(1);
    });
    datasets.push({
      label:'Group Avg',
      data: avgSeries,
      borderColor:'#444',
      backgroundColor:'transparent',
      borderWidth:1.5,
      borderDash:[5,4],
      pointRadius:0,
      tension:0.3,
    });
  }

  mkChart(canvasId,{
    type:'line',
    data:{
      labels: ALL_DATES,
      datasets
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      animation:false,
      plugins:{
        legend:{
          display:true, position:'top',
          labels:{boxWidth:10,padding:8,font:{size:10}}
        },
        tooltip:{...DARK_TOOLTIP, mode:'index', intersect:false}
      },
      scales:{
        x:{
          ticks:{
            maxTicksLimit:10,
            callback:(_,i)=>{
              if(i%7===0) return ALL_DATES[i]?ALL_DATES[i].substring(5):'';
              return '';
            },
            font:{size:10}
          },
          grid:{color:'#1e1e1e'}
        },
        y:{grid:{color:'#1e1e1e'}, beginAtZero:true}
      }
    }
  });
}

// ─── HEATMAP ─────────────────────────────────────────────────────────────────
function renderHeatmap(containerId, name=null) {
  const dc = dailyCounts(name);
  const maxVal = Math.max(...Object.values(dc),1);
  const tooltip = document.getElementById('tooltip');

  // start from Monday of the first week
  const s = new Date(minDate);
  const dow0 = (s.getDay()+6)%7; // Mon=0
  s.setDate(s.getDate()-dow0);

  const weeks=[], CELL=13, GAP=2, PL=26, PT=22;
  let week=[], d=new Date(s);
  while (d<=maxDate) {
    if(week.length===7){weeks.push(week);week=[];}
    const ds=d.toISOString().substring(0,10);
    week.push({ds, cnt:dc[ds]||0, active:d>=minDate&&d<=maxDate});
    d.setDate(d.getDate()+1);
  }
  while(week.length<7) week.push({ds:'',cnt:0,active:false});
  weeks.push(week);

  const W=PL+weeks.length*(CELL+GAP)+60, H=PT+7*(CELL+GAP)+24;

  function col(cnt,active){
    if(!active||cnt===0) return '#1a1a1a';
    const t=Math.min(cnt/maxVal,1);
    return `rgb(${Math.round(20+t*10)},${Math.round(60+t*140)},${Math.round(20+t*10)})`;
  }

  let svg=`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="display:block">`;
  ['M','T','W','T','F','S','S'].forEach((l,i)=>{
    if(i%2===0) svg+=`<text x="${PL-4}" y="${PT+i*(CELL+GAP)+CELL-1}" text-anchor="end" font-size="9" fill="#555">${l}</text>`;
  });

  let lastMon='';
  weeks.forEach((wk,wi)=>{
    const x=PL+wi*(CELL+GAP);
    const first=wk.find(c=>c.active&&c.ds);
    if(first){
      const mo=new Date(first.ds).toLocaleString('en-US',{month:'short'});
      if(mo!==lastMon){ svg+=`<text x="${x}" y="${PT-6}" font-size="9" fill="#555">${mo}</text>`; lastMon=mo; }
    }
    wk.forEach((cell,di)=>{
      const y=PT+di*(CELL+GAP);
      svg+=`<rect x="${x}" y="${y}" width="${CELL}" height="${CELL}" rx="2" fill="${col(cell.cnt,cell.active)}" data-ds="${cell.ds}" data-cnt="${cell.cnt}" data-a="${cell.active}" style="cursor:${cell.active?'pointer':'default'}"/>`;
    });
  });

  // legend
  const lx=W-60, ly=H-13;
  svg+=`<text x="${lx-2}" y="${ly+CELL-1}" font-size="9" fill="#555" text-anchor="end">Less</text>`;
  [0,.25,.5,.75,1].forEach((v,i)=>
    svg+=`<rect x="${lx+i*(CELL+1)}" y="${ly}" width="${CELL}" height="${CELL}" rx="2" fill="${col(v*maxVal,true)}"/>`
  );
  svg+=`<text x="${lx+5*(CELL+1)+2}" y="${ly+CELL-1}" font-size="9" fill="#555">More</text>`;
  svg+=`</svg>`;

  const el=document.getElementById(containerId);
  el.innerHTML=svg;

  el.querySelectorAll('rect[data-a="true"]').forEach(r=>{
    r.addEventListener('mouseenter',()=>{
      tooltip.style.display='block';
      tooltip.innerHTML=`<strong>${r.dataset.ds}</strong><br>${r.dataset.cnt} poo${r.dataset.cnt!='1'?'s':''}`;
    });
    r.addEventListener('mousemove',e=>{
      tooltip.style.left=(e.clientX+14)+'px';
      tooltip.style.top=(e.clientY-30)+'px';
    });
    r.addEventListener('mouseleave',()=>tooltip.style.display='none');
  });
}

// ─── MEDALS ──────────────────────────────────────────────────────────────────
function maxInWindow(name, ms) {
  const ts = eventsFor(name).map(e => e.date.getTime()).sort((a,b)=>a-b);
  let max = 0;
  for (let i = 0; i < ts.length; i++) {
    let cnt = 1;
    for (let j = i+1; j < ts.length && ts[j]-ts[i] <= ms; j++) cnt++;
    if (cnt > max) max = cnt;
  }
  return max;
}

function bestInWindow(hours) {
  let best = {name:'', count:0};
  NAMES.forEach(n => {
    const c = maxInWindow(n, hours*3600000);
    if (c > best.count) best = {name:n, count:c};
  });
  return best;
}

// Day boundary at 6am: anything before 6am belongs to previous day
function pooDayKey(date) {
  const d = new Date(date);
  if (d.getHours() < 6) d.setDate(d.getDate()-1);
  return d.toISOString().substring(0,10);
}

function earlyLateStats() {
  const byDay = {};
  events.forEach(e => {
    const key = pooDayKey(e.date);
    if (!byDay[key]) byDay[key] = [];
    byDay[key].push(e);
  });
  const firstCounts = {}, lastCounts = {};
  Object.values(byDay).forEach(dayEvts => {
    dayEvts.sort((a,b) => a.date-b.date);
    const first = dayEvts[0].name;
    const last  = dayEvts[dayEvts.length-1].name;
    firstCounts[first] = (firstCounts[first]||0)+1;
    lastCounts[last]   = (lastCounts[last]||0)+1;
  });
  const earlyBird = NAMES.reduce((b,n)=>(firstCounts[n]||0)>(firstCounts[b]||0)?n:b, NAMES[0]);
  const nightOwl  = NAMES.reduce((b,n)=>(lastCounts[n]||0)>(lastCounts[b]||0)?n:b, NAMES[0]);
  return {
    earlyBird: {name:earlyBird, count:firstCounts[earlyBird]||0},
    nightOwl:  {name:nightOwl,  count:lastCounts[nightOwl]||0},
  };
}

function fmtHour(h) {
  const hh = Math.floor(h), mm = Math.round((h-hh)*60);
  const ampm = hh < 12 ? 'am' : 'pm';
  return `${hh%12||12}:${String(mm).padStart(2,'0')}${ampm}`;
}

function dailyStdDev(name) {
  const vals = Object.values(dailyCounts(name));
  if (vals.length < 2) return 0;
  const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
  return Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length);
}

function pooPartners() {
  const byDay = {};
  events.forEach(e => { if(!byDay[e.ds]) byDay[e.ds]=[]; byDay[e.ds].push(e); });

  const pairClosest = {}; // key -> [min gap per shared day]
  Object.values(byDay).forEach(dayEvts => {
    // Group events by person within this day
    const byPerson = {};
    dayEvts.forEach(e => { if(!byPerson[e.name]) byPerson[e.name]=[]; byPerson[e.name].push(e.date.getTime()); });
    const people = Object.keys(byPerson);
    for(let i=0;i<people.length;i++) for(let j=i+1;j<people.length;j++) {
      const key=[people[i],people[j]].sort().join('||');
      // Find the minimum gap between any event of person i and any event of person j
      let minGap = Infinity;
      byPerson[people[i]].forEach(ta => byPerson[people[j]].forEach(tb => {
        const gap = Math.abs(ta-tb)/60000;
        if(gap < minGap) minGap = gap;
      }));
      if(!pairClosest[key]) pairClosest[key]=[];
      pairClosest[key].push(minGap);
    }
  });

  let best={key:'',avg:Infinity,count:0};
  Object.entries(pairClosest).forEach(([key,gaps])=>{
    if(gaps.length<10) return;
    const avg=gaps.reduce((a,b)=>a+b,0)/gaps.length;
    if(avg<best.avg) best={key,avg,count:gaps.length};
  });
  const [n1,n2]=best.key.split('||');
  return {n1,n2,avgMins:best.avg,count:best.count};
}

function chainStarter() {
  const triggered={}, total={};
  events.forEach(e=>{
    total[e.name]=(total[e.name]||0)+1;
    const t0=e.date.getTime();
    const fires=events.some(e2=>e2.name!==e.name&&e2.date.getTime()>t0&&e2.date.getTime()-t0<=3600000);
    if(fires) triggered[e.name]=(triggered[e.name]||0)+1;
  });
  const best=NAMES.reduce((b,n)=>{
    if((total[n]||0)<20) return b;
    const rate=(triggered[n]||0)/(total[n]||1);
    return rate>b.rate?{name:n,rate,count:triggered[n]||0}:b;
  },{name:'',rate:-Infinity,count:0});
  return best;
}

function loneWolf() {
  const solo={};
  events.forEach(e=>{
    const t0=e.date.getTime();
    const hasBuddy=events.some(e2=>e2.name!==e.name&&Math.abs(e2.date.getTime()-t0)<=7200000);
    if(!hasBuddy) solo[e.name]=(solo[e.name]||0)+1;
  });
  const best=NAMES.reduce((b,n)=>(solo[n]||0)>(solo[b]||0)?n:b,NAMES[0]);
  return {name:best,count:solo[best]||0};
}

function weekendWarrior() {
  const we={},wd={};
  events.forEach(e=>{
    const dow=e.date.getDay();
    if(dow===0||dow===6) we[e.name]=(we[e.name]||0)+1;
    else wd[e.name]=(wd[e.name]||0)+1;
  });
  const best=NAMES.reduce((b,n)=>{
    const ratio=((we[n]||0)/2)/((wd[n]||1)/5);
    return ratio>b.ratio?{name:n,ratio,we:we[n]||0,wd:wd[n]||0}:b;
  },{name:'',ratio:-Infinity});
  return best;
}

function onFire() {
  const mid=ALL_DATES[Math.floor(ALL_DATES.length/2)];
  const best=NAMES.reduce((b,n)=>{
    const dc=dailyCounts(n);
    const firstHalf=Object.entries(dc).filter(([d])=>d<mid).map(([,v])=>v);
    const secHalf=Object.entries(dc).filter(([d])=>d>=mid).map(([,v])=>v);
    if(!firstHalf.length||!secHalf.length) return b;
    const avg1=firstHalf.reduce((a,v)=>a+v,0)/firstHalf.length;
    const avg2=secHalf.reduce((a,v)=>a+v,0)/secHalf.length;
    const growth=avg2-avg1;
    return growth>b.growth?{name:n,growth,avg1,avg2}:b;
  },{name:'',growth:-Infinity});
  return best;
}

function machine() {
  const best=NAMES.reduce((b,n)=>{
    const vals=Object.values(dailyCounts(n));
    if(vals.length<5) return b;
    const mean=vals.reduce((a,v)=>a+v,0)/vals.length;
    const std=Math.sqrt(vals.reduce((a,v)=>a+(v-mean)**2,0)/vals.length);
    const cv=std/mean;
    return cv<b.cv?{name:n,cv,mean}:b;
  },{name:'',cv:Infinity});
  return best;
}

function renderMedals() {
  const w1 = bestInWindow(1), w2 = bestInWindow(2), w3 = bestInWindow(3);
  const {earlyBird, nightOwl} = earlyLateStats();
  const variable  = NAMES.reduce((b,n)=>{ const v=dailyStdDev(n); return v>b.v?{name:n,v}:b; },{name:'',v:-Infinity});
  const partners  = pooPartners();
  const chain     = chainStarter();
  const wolf      = loneWolf();
  const warrior   = weekendWarrior();
  const fire      = onFire();
  const mach      = machine();

  const partnerColor = partners.n1 ? COLORS[partners.n1] : '#fff';
  const partnerName  = partners.n1 ? `${partners.n1} & ${partners.n2}` : '—';

  const medals = [
    { icon:'⚡', title:'Corta-Heces',     name:w1.name,       stat:`${w1.count} poos in 1h`,                      info:'Most poos logged within any single 1-hour window.' },
    { icon:'🚀', title:'2h Blitz',        name:w2.name,       stat:`${w2.count} poos in 2h`,                      info:'Most poos logged within any single 2-hour window.' },
    { icon:'💪', title:'3h Beast',        name:w3.name,       stat:`${w3.count} poos in 3h`,                      info:'Most poos logged within any single 3-hour window.' },
    { icon:'🌅', title:'Early Bird',      name:earlyBird.name,stat:`First of day ${earlyBird.count}×`,            info:'Who is most often the first person in the group to poop each day (day resets at 6am).' },
    { icon:'🌙', title:'Night Owl',       name:nightOwl.name, stat:`Last of day ${nightOwl.count}×`,              info:'Who is most often the last person in the group to poop each day (day resets at 6am).' },
    { icon:'🎲', title:'Wild Card',       name:variable.name, stat:`±${variable.v.toFixed(1)} poos/day`,         info:'Highest std deviation of daily poo count — the most unpredictable pooper.' },
    { icon:'💑', title:'Poo Partners',    name:partnerName,   stat:`avg ${Math.round(partners.avgMins)}min apart`, info:'Pair with the smallest average closest-encounter gap on days they both pooped (min. 10 shared days).', color: partnerColor },
    { icon:'🔗', title:'Chain Reaction',  name:chain.name,    stat:`${(chain.rate*100).toFixed(0)}% trigger rate`,info:'% of their poos followed by someone else pooping within 1h. Min. 20 poos to qualify.' },
    { icon:'🐺', title:'Lone Wolf',       name:wolf.name,     stat:`${wolf.count} solo poos`,                     info:'Most poos with nobody else pooping within 2 hours either side.' },
    { icon:'🏄', title:'Weekend Warrior', name:warrior.name,  stat:`${warrior.ratio.toFixed(2)}× weekend rate`,   info:'Highest ratio of poos per weekend day vs poos per weekday (normalized for 2 vs 5 days).' },
    { icon:'📈', title:'On Fire',         name:fire.name,     stat:`+${fire.growth.toFixed(2)} poos/day`,         info:'Biggest improvement: avg daily poos in the second half of the season vs the first half.' },
    { icon:'🎯', title:'Machine',         name:mach.name,     stat:`CV ${(mach.cv*100).toFixed(0)}% consistency`, info:'Lowest coefficient of variation (std dev / mean) of daily poos — the most clockwork consistent.' },
  ];

  document.getElementById('medals-grid').innerHTML = medals.map(m => {
    const c = m.color || COLORS[m.name] || '#888';
    return `
    <div class="medal-card" style="border-color:${c}40">
      <div class="medal-info">i<span class="medal-info-tip">${m.info}</span></div>
      <div class="medal-icon" style="background:${c}20">${m.icon}</div>
      <div class="medal-body">
        <div class="medal-title">${m.title}</div>
        <div class="medal-winner" style="color:${c}">${m.name}</div>
        <div class="medal-stat">${m.stat}</div>
      </div>
    </div>`;
  }).join('');
}
